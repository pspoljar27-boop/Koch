<style>
:root {
  --bg: #F2F3EF; --surface: #FFFFFF; --ink: #141916; --muted: #69716C; --line: #E1E4DE;
  --accent: #1F5C3F; --accent-ink: #FFFFFF; --soft: #E5EDE7;
  --heat: #A85F0E; --heat-soft: #F5E9D8; --danger: #A3261C;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1311; --surface: #181D1A; --ink: #ECEFEA; --muted: #8E9892; --line: #262C28;
    --accent: #8CCBA4; --accent-ink: #0F1311; --soft: #1D2A22;
    --heat: #E9A85A; --heat-soft: #2D2416; --danger: #F08A80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1311; --surface: #181D1A; --ink: #ECEFEA; --muted: #8E9892; --line: #262C28;
  --accent: #8CCBA4; --accent-ink: #0F1311; --soft: #1D2A22;
  --heat: #E9A85A; --heat-soft: #2D2416; --danger: #F08A80;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Instrument Sans", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 8px; }
img { max-width: 100%; display: block; }

.wrap { max-width: 560px; margin: 0 auto; padding: 12px 22px 48px; padding-left: max(22px, env(safe-area-inset-left)); padding-right: max(22px, env(safe-area-inset-right)); }
.bar { display: flex; justify-content: space-between; align-items: center; height: 48px; }
.brand { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 8px; }
.brand i { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); display: inline-block; }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; color: var(--muted); }
.icon-btn:active { background: var(--line); }

h1 { font-size: clamp(36px, 10vw, 46px); line-height: 1.04; letter-spacing: -0.035em; font-weight: 600; margin: 28px 0 0; }
h2 { font-size: 20px; letter-spacing: -0.01em; font-weight: 600; margin: 0; }
.lead { color: var(--muted); margin: 12px 0 0; max-width: 36ch; }
.fine { color: var(--muted); font-size: 13px; line-height: 1.45; margin: 12px 0 0; }
.back { color: var(--muted); font-weight: 500; display: inline-flex; align-items: center; gap: 6px; height: 40px; }
.notice { display: block; width: 100%; text-align: left; margin-top: 20px; padding: 14px 16px; border-radius: 14px; background: var(--heat-soft); font-weight: 500; }

/* Auslöser */
.shutter-zone { display: flex; flex-direction: column; align-items: center; padding: 44px 0 8px; }
.shutter { width: 132px; height: 132px; border-radius: 50%; border: 3px solid var(--ink); display: grid; place-items: center; transition: transform .15s; }
.shutter span { width: 104px; height: 104px; border-radius: 50%; background: var(--accent); display: block; }
.shutter:active { transform: scale(.94); }
.shutter-label { margin-top: 16px; font-weight: 600; }
.text-btn { margin-top: 6px; color: var(--muted); font-weight: 500; height: 40px; }

.photos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 28px; }
.ph { position: relative; aspect-ratio: 3/4; border-radius: 18px; overflow: hidden; background: var(--surface); }
.ph img { width: 100%; height: 100%; object-fit: cover; }
.ph .x { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; border-radius: 50%; background: rgba(0,0,0,.5); color: #fff; display: grid; place-items: center; font-size: 15px; }
.ph.add { border: 1.5px dashed var(--line); background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--muted); font-size: 14px; gap: 4px; }
.ph.add b { font-size: 34px; font-weight: 300; color: var(--accent); line-height: 1; }

.row { display: flex; align-items: center; gap: 16px; margin-top: 24px; padding: 16px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.row .t { flex: 1; }
.row .t strong { display: block; font-weight: 600; }
.row .t small { color: var(--muted); font-size: 14px; }
.switch { position: relative; width: 52px; height: 32px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch span { position: absolute; inset: 0; border-radius: 99px; background: var(--line); transition: background .2s; pointer-events: none; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(20px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 3px; }

.primary { display: block; width: 100%; margin-top: 22px; height: 56px; border-radius: 16px; background: var(--ink); color: var(--bg); font-weight: 600; font-size: 17px; }
.primary:disabled { opacity: .3; cursor: default; }
.primary:not(:disabled):active { transform: scale(.985); }
.secondary { display: block; width: 100%; margin-top: 12px; height: 50px; border-radius: 14px; border: 1px solid var(--line); font-weight: 600; }
.error { color: var(--danger); margin: 16px 0 0; }

/* Laden */
.loading { min-height: 70vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.spin { width: 44px; height: 44px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: r .9s linear infinite; }
@keyframes r { to { transform: rotate(360deg); } }
.loading p { color: var(--muted); margin-top: 20px; }

/* Ergebnisse */
.section { margin-top: 28px; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; }
.count { color: var(--muted); font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); font-size: 15px; }
.chip em { font-style: normal; color: var(--muted); font-size: 13px; }
.add-row { display: flex; gap: 8px; margin-top: 12px; }
.field { width: 100%; height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-size: 16px; }
.field:focus { outline: none; border-color: var(--accent); }
.add-btn { flex: none; padding: 0 16px; border-radius: 12px; background: var(--soft); color: var(--accent); font-weight: 600; }

.seg { display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); margin-top: 32px; }
.seg button { height: 42px; border-radius: 10px; font-weight: 600; color: var(--muted); font-size: 15px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }

.cards { margin-top: 8px; }
.card { display: block; width: 100%; text-align: left; padding: 20px 0; border-bottom: 1px solid var(--line); }
.card:active { opacity: .6; }
.card h3 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.3; }
.meta { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 8px; color: var(--muted); font-size: 14px; }
.meta .p { color: var(--accent); font-weight: 600; }
.card.af .meta .p { color: var(--heat); }
.missing { color: var(--muted); font-size: 14px; margin-top: 6px; }
.empty { color: var(--muted); padding: 24px 0; }

/* Rezept */
.kind { margin-top: 20px; font-size: 14px; font-weight: 600; color: var(--accent); }
.kind.af { color: var(--heat); }
.recipe h1 { margin-top: 6px; font-size: clamp(30px, 8.5vw, 40px); }
.facts { color: var(--muted); margin-top: 10px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.macros { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 28px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.macros div { padding: 16px 0; text-align: center; }
.macros div + div { border-left: 1px solid var(--line); }
.macros b { display: block; font-size: 24px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.macros small { color: var(--muted); font-size: 12px; }
.macros .hi b { color: var(--accent); }
.recipe.af .macros .hi b { color: var(--heat); }

.timer { margin-top: 28px; padding: 22px; border-radius: 22px; background: var(--heat-soft); }
.timer .lbl { font-weight: 600; }
.timer .time { font-size: 64px; font-weight: 600; letter-spacing: -0.04em; line-height: 1.1; margin: 6px 0 16px; font-variant-numeric: tabular-nums; color: var(--heat); }
.timer .btns { display: flex; gap: 10px; }
.timer .go { flex: 1; height: 50px; border-radius: 14px; background: var(--heat); color: var(--bg); font-weight: 600; }
.timer .rs { height: 50px; padding: 0 18px; border-radius: 14px; border: 1px solid color-mix(in srgb, var(--heat) 35%, transparent); font-weight: 600; }

.list { list-style: none; padding: 0; margin: 14px 0 0; }
.list li { padding: 11px 0; border-bottom: 1px solid var(--line); }
.steps { list-style: none; padding: 0; margin: 14px 0 0; counter-reset: s; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 34px 1fr; padding: 12px 0; }
.steps li::before { content: counter(s); font-weight: 600; color: var(--accent); }
.recipe.af .steps li::before { color: var(--heat); }

/* Einstellungen */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 20; display: none; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--bg); border-radius: 24px 24px 0 0; padding: 10px 22px calc(24px + env(safe-area-inset-bottom, 0px)); max-height: 92vh; overflow-y: auto; transform: translateY(105%); transition: transform .28s cubic-bezier(.2,.8,.2,1); max-width: 560px; margin: 0 auto; }
.sheet.open { transform: none; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 14px; }
.sheet label { display: block; font-weight: 600; margin-top: 22px; }
.sheet .hint { color: var(--muted); font-size: 14px; margin: 2px 0 8px; }
.sheet a { color: var(--accent); font-weight: 500; display: inline-block; margin-top: 10px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation-duration: 2s !important; } }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="lib" accept="image/*" multiple hidden>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
  <div class="grab"></div>
  <div class="section-head"><h2 id="sheet-title">Einstellungen</h2><button class="back" id="sheet-close">Schließen</button></div>
  <label for="f-key">Gemini-API-Schlüssel</label>
  <p class="hint">Kostenlos in Google AI Studio. Bleibt nur auf diesem Gerät gespeichert.</p>
  <input class="field" id="f-key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="AIza…">
  <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Schlüssel in Google AI Studio holen</a>
  <label for="f-model">Modell</label>
  <p class="hint">„gemini-flash-latest“ nimmt automatisch das aktuelle Flash-Modell.</p>
  <input class="field" id="f-model" autocomplete="off" autocapitalize="off" spellcheck="false">
  <button class="primary" id="f-save">Speichern</button>
  <p class="fine">Im kostenlosen Tarif darf Google Fotos und Antworten zur Verbesserung seiner Modelle verwenden.</p>
</div>

<script>
(() => {
'use strict';

/* ---------- Gemini ---------- */
const API = 'https://generativelanguage.googleapis.com/v1beta/models';
const DEFAULT_MODEL = 'gemini-flash-latest';
const FALLBACKS = ['gemini-flash-latest', 'gemini-3-flash-preview', 'gemini-3.1-flash-lite'];
const MAX_PHOTOS = 4;

const SCHEMA = {
  type: 'OBJECT',
  properties: {
    detected_ingredients: { type: 'ARRAY', items: { type: 'STRING' } },
    recipes: { type: 'ARRAY', items: { type: 'OBJECT', properties: {
      title: { type: 'STRING' },
      method: { type: 'STRING', enum: ['airfryer', 'pfanne', 'topf'] },
      servings: { type: 'INTEGER' }, time_minutes: { type: 'INTEGER' },
      airfryer_temp_c: { type: 'INTEGER' }, airfryer_minutes: { type: 'INTEGER' },
      heat: { type: 'STRING' },
      calories: { type: 'INTEGER' }, protein_g: { type: 'INTEGER' }, carbs_g: { type: 'INTEGER' }, fat_g: { type: 'INTEGER' },
      ingredients: { type: 'ARRAY', items: { type: 'STRING' } },
      missing: { type: 'ARRAY', items: { type: 'STRING' } },
      steps: { type: 'ARRAY', items: { type: 'STRING' } }
    }, required: ['title','method','servings','time_minutes','airfryer_temp_c','airfryer_minutes','heat','calories','protein_g','carbs_g','fat_g','ingredients','missing','steps'] } }
  },
  required: ['detected_ingredients', 'recipes']
};

function prompt(hasImages, ingredients, highProtein) {
  const src = hasImages
    ? 'Analysiere die Fotos (Kühlschrank, Vorratsschrank oder Zutaten). Erkenne alle essbaren Lebensmittel, die wirklich sichtbar sind. Was du nicht sicher erkennst, lässt du weg. Liste sie in detected_ingredients, kurz und auf Deutsch (z. B. "Eier", "Hähnchenbrust", "Paprika rot").'
    : 'Verfügbare Zutaten (vom Nutzer bestätigt): ' + ingredients.join(', ') + '. Gib genau diese Liste in detected_ingredients zurück.';
  return `Du bist Ernährungsberater und erfahrener Koch für schnelle Alltagsküche.

${src}

Immer vorhanden (nicht in detected_ingredients aufnehmen): Öl, Butter, Salz, Pfeffer, Paprikapulver, Knoblauchpulver, Chiliflocken, getrocknete Kräuter, Currypulver, Senf, Essig, Zucker, Mehl, Brühpulver.

Schlage genau 6 Gerichte vor: 3 für den Airfryer (method "airfryer") und 3 für Pfanne oder Topf (method "pfanne" oder "topf").

Regeln:
- Gesamtzeit höchstens 25 Minuten, lieber weniger.
- Lecker und alltagstauglich.
- Nutze überwiegend die erkannten Zutaten plus die Basics. Höchstens 1 zusätzliche Zutat pro Rezept, die dann in "missing" steht (sonst leeres Array).
${highProtein ? '- Bevorzuge proteinreiche Gerichte (Ziel: mindestens 30 g Protein pro Portion, wenn die Zutaten das hergeben).' : '- Achte auf ausgewogene Gerichte.'}
- Airfryer: airfryer_temp_c (°C) und airfryer_minutes (Garzeit im Gerät) ausfüllen, heat = "".
- Pfanne/Topf: airfryer_temp_c = 0, airfryer_minutes = 0, heat = "niedrig", "mittel" oder "hoch".
- Zutaten mit Mengen (z. B. "200 g Hähnchenbrust").
- Schritte kurz und klar, ohne Nummerierung, Temperaturen in °C, Zeiten in Minuten.
- Makros pro Portion realistisch schätzen.
- Alles auf Deutsch.`;
}

async function callModel(model, key, parts) {
  const res = await fetch(`${API}/${encodeURIComponent(model)}:generateContent`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'x-goog-api-key': key },
    body: JSON.stringify({
      contents: [{ role: 'user', parts }],
      generationConfig: { responseMimeType: 'application/json', responseSchema: SCHEMA, temperature: 0.7 }
    })
  });
  const json = await res.json().catch(() => ({}));
  if (!res.ok) { const e = new Error(json?.error?.message || 'HTTP ' + res.status); e.status = res.status; throw e; }
  const text = (json?.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('');
  if (!text) { const e = new Error('Keine Antwort erhalten. Versuch es mit einem anderen Foto.'); e.status = 0; throw e; }
  return JSON.parse(text.replace(/```json|```/g, '').trim());
}

function normalize(d) {
  const t = Date.now();
  return {
    detected: Array.isArray(d?.detected_ingredients) ? d.detected_ingredients : [],
    recipes: (Array.isArray(d?.recipes) ? d.recipes : []).map((r, i) => ({
      id: 'r' + t + i,
      title: r.title || 'Gericht',
      method: ['airfryer', 'pfanne', 'topf'].includes(r.method) ? r.method : 'pfanne',
      servings: r.servings || 1, time: r.time_minutes || 0,
      afTemp: r.airfryer_temp_c || 0, afMin: r.airfryer_minutes || 0, heat: (r.heat || '').toLowerCase(),
      kcal: r.calories || 0, protein: r.protein_g || 0, carbs: r.carbs_g || 0, fat: r.fat_g || 0,
      ingredients: r.ingredients || [], missing: r.missing || [],
      steps: (r.steps || []).map(s => s.replace(/^\s*(Schritt\s*)?\d+[.:)]\s*/i, ''))
    }))
  };
}

async function suggest({ images, ingredients }) {
  const parts = [
    ...images.map(b => ({ inline_data: { mime_type: 'image/jpeg', data: b } })),
    { text: prompt(images.length > 0, ingredients, S.highProtein) }
  ];
  const chosen = (S.model || '').trim() || DEFAULT_MODEL;
  const order = [chosen, ...FALLBACKS.filter(m => m !== chosen)];
  let last;
  for (const m of order) {
    try { return normalize(await callModel(m, S.key, parts)); }
    catch (e) { last = e; if (e.status === 404) continue; throw e; }
  }
  throw last;
}

function friendly(e) {
  const m = String(e?.message || '');
  if (e?.status === 429) return 'Das kostenlose Limit ist gerade erreicht. Warte eine Minute oder versuch es morgen wieder.';
  if (e?.status === 400 && /api key/i.test(m)) return 'Der API-Schlüssel ist ungültig. Prüfe ihn in den Einstellungen.';
  if (e?.status === 403) return 'Der API-Schlüssel hat keinen Zugriff. Prüfe ihn in Google AI Studio.';
  if (e instanceof SyntaxError) return 'Die Antwort war unvollständig. Tippe nochmal auf „Gerichte vorschlagen“.';
  if (/load failed|failed to fetch|network/i.test(m)) return 'Keine Verbindung zu Gemini. Prüfe deine Internetverbindung.';
  return m || 'Unbekannter Fehler.';
}

/* ---------- Speicher ---------- */
const store = {
  get(k, f) { try { const v = localStorage.getItem('kk_' + k); return v === null ? f : JSON.parse(v); } catch { return f; } },
  set(k, v) { try { localStorage.setItem('kk_' + k, JSON.stringify(v)); } catch {} }
};

/* ---------- Zustand ---------- */
const S = {
  key: store.get('key', ''), model: store.get('model', DEFAULT_MODEL), highProtein: store.get('hp', true),
  view: 'home', photos: [], loading: false, error: '',
  detected: [], recipes: [], edited: false, tab: 'af', current: null,
  last: store.get('last', null)
};

const app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const gear = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>';
const chevron = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>';

const heatWord = h => ({ niedrig: 'niedrige', mittel: 'mittlere', hoch: 'hohe' }[h] || '');
const tool = r => r.method === 'airfryer' ? 'Airfryer' : r.method === 'topf' ? 'Topf' : 'Pfanne';
const heatLabel = r => r.method === 'airfryer' ? `${r.afTemp} °C` : heatWord(r.heat) ? `${heatWord(r.heat)} Hitze` : tool(r);

/* ---------- Ansichten ---------- */
function bar() {
  return `<div class="bar"><div class="brand"><i></i>Kühlschrank-Koch</div>
  <button class="icon-btn" data-a="settings" aria-label="Einstellungen">${gear}</button></div>`;
}

function viewHome() {
  const n = S.photos.length;
  const shots = n === 0
    ? `<div class="shutter-zone">
         <button class="shutter" data-a="cam" aria-label="Foto aufnehmen"><span></span></button>
         <div class="shutter-label">Foto aufnehmen</div>
         <button class="text-btn" data-a="lib">Aus Mediathek wählen</button>
       </div>`
    : `<div class="photos">
         ${S.photos.map((p, i) => `<div class="ph"><img src="${p.url}" alt="Foto ${i + 1}"><button class="x" data-a="rm" data-i="${i}" aria-label="Foto ${i + 1} entfernen">✕</button></div>`).join('')}
         ${n < MAX_PHOTOS ? `<button class="ph add" data-a="cam"><b>+</b>Noch ein Foto</button>` : ''}
       </div>
       ${n < MAX_PHOTOS ? `<button class="text-btn" data-a="lib" style="width:100%">Aus Mediathek wählen</button>` : ''}`;

  return `${bar()}
  <h1>Was ist da?</h1>
  <p class="lead">Fotografiere Kühlschrank, Vorrat oder einzelne Zutaten. Daraus werden schnelle Gerichte für Airfryer, Pfanne und Topf.</p>
  ${!S.key ? `<button class="notice" data-a="settings">Hinterlege zuerst deinen kostenlosen Gemini-API-Schlüssel.</button>` : ''}
  ${shots}
  <div class="row">
    <div class="t"><strong>Proteinreich bevorzugen</strong><small>Ziel ab 30 g Protein pro Portion</small></div>
    <label class="switch"><input type="checkbox" id="hp" ${S.highProtein ? 'checked' : ''} aria-label="Proteinreich bevorzugen"><span></span></label>
  </div>
  ${S.error ? `<p class="error" role="alert">${esc(S.error)}</p>` : ''}
  <button class="primary" data-a="run" ${n ? '' : 'disabled'}>Gerichte vorschlagen</button>
  <p class="fine">Öl, Salz, Pfeffer und gängige Gewürze werden automatisch eingeplant.</p>
  ${S.last && S.last.recipes?.length ? `<button class="secondary" data-a="last">Letzte Vorschläge ansehen</button>` : ''}`;
}

let loadTimer;
function viewLoading() {
  return `<div class="loading" aria-live="polite"><div class="spin"></div><p id="ltxt">Zutaten werden erkannt …</p></div>`;
}

function viewResults() {
  const af = S.recipes.filter(r => r.method === 'airfryer');
  const herd = S.recipes.filter(r => r.method !== 'airfryer');
  const list = S.tab === 'af' ? af : herd;
  return `<div class="bar"><button class="back" data-a="home">${chevron}Neue Fotos</button>
    <button class="icon-btn" data-a="settings" aria-label="Einstellungen">${gear}</button></div>
  <div class="section">
    <div class="section-head"><h2>Erkannt</h2><span class="count">${S.detected.length} Zutaten</span></div>
    <div class="chips">${S.detected.map((d, i) => `<button class="chip" data-a="rmi" data-i="${i}" aria-label="${esc(d)} entfernen">${esc(d)}<em>✕</em></button>`).join('')}</div>
    <form class="add-row" id="addf"><input class="field" id="addi" placeholder="Zutat hinzufügen" enterkeyhint="done"><button class="add-btn" type="submit">Hinzufügen</button></form>
    ${S.edited ? `<button class="primary" data-a="regen">Mit dieser Liste neu vorschlagen</button>` : ''}
    ${S.error ? `<p class="error" role="alert">${esc(S.error)}</p>` : ''}
  </div>
  <div class="seg" role="group" aria-label="Zubereitung">
    <button data-a="tab" data-t="af" aria-pressed="${S.tab === 'af'}">Airfryer (${af.length})</button>
    <button data-a="tab" data-t="herd" aria-pressed="${S.tab === 'herd'}">Pfanne &amp; Topf (${herd.length})</button>
  </div>
  <div class="cards">
    ${list.length ? list.map(r => `
      <button class="card ${r.method === 'airfryer' ? 'af' : ''}" data-a="open" data-id="${r.id}">
        <h3>${esc(r.title)}</h3>
        <div class="meta"><span>${r.time} min</span><span>${esc(heatLabel(r))}</span><span class="p">${r.protein} g Protein</span><span>${r.kcal} kcal</span></div>
        ${r.missing.length ? `<div class="missing">Brauchst du noch: ${esc(r.missing.join(', '))}</div>` : ''}
      </button>`).join('') : `<p class="empty">Keine Vorschläge in dieser Kategorie. Füge Zutaten hinzu und lass neu vorschlagen.</p>`}
  </div>`;
}

function viewRecipe() {
  const r = S.current, af = r.method === 'airfryer';
  return `<div class="recipe ${af ? 'af' : ''}">
  <div class="bar"><button class="back" data-a="results">${chevron}Alle Vorschläge</button></div>
  <div class="kind ${af ? 'af' : ''}">${tool(r)}</div>
  <h1>${esc(r.title)}</h1>
  <div class="facts"><span>${r.time} min gesamt</span><span>${esc(heatLabel(r))}</span><span>${r.servings} ${r.servings === 1 ? 'Portion' : 'Portionen'}</span></div>
  <div class="macros">
    <div><b>${r.kcal}</b><small>kcal</small></div>
    <div class="hi"><b>${r.protein}</b><small>g Protein</small></div>
    <div><b>${r.carbs}</b><small>g Kohlenh.</small></div>
    <div><b>${r.fat}</b><small>g Fett</small></div>
  </div>
  <p class="fine">Pro Portion, geschätzt.</p>
  ${af && r.afMin ? `<div class="timer">
    <div class="lbl">Airfryer auf ${r.afTemp} °C</div>
    <div class="time" id="tt" aria-live="off">${fmt(T.left ?? r.afMin * 60)}</div>
    <div class="btns"><button class="go" data-a="tgo" id="tgo">Timer starten</button><button class="rs" data-a="trs" id="trs" hidden>Zurücksetzen</button></div>
  </div>` : ''}
  <div class="section"><h2>Zutaten</h2>
    <ul class="list">${r.ingredients.map(x => `<li>${esc(x)}</li>`).join('')}</ul>
    ${r.missing.length ? `<p class="missing">Nicht auf dem Foto: ${esc(r.missing.join(', '))}</p>` : ''}
  </div>
  <div class="section"><h2>Zubereitung</h2>
    <ol class="steps">${r.steps.map(x => `<li><span>${esc(x)}</span></li>`).join('')}</ol>
  </div></div>`;
}

function render() {
  clearInterval(loadTimer);
  if (S.loading) {
    app.innerHTML = viewLoading();
    const lines = ['Zutaten werden erkannt …', 'Rezepte werden zusammengestellt …', 'Makros werden geschätzt …'];
    let i = 0;
    loadTimer = setInterval(() => { const el = document.getElementById('ltxt'); if (el) el.textContent = lines[++i % lines.length]; }, 2200);
    return;
  }
  app.innerHTML = S.view === 'home' ? viewHome() : S.view === 'results' ? viewResults() : viewRecipe();
  if (S.view === 'recipe') syncTimer();
}

function go(view) { S.view = view; S.error = ''; render(); window.scrollTo(0, 0); }

/* ---------- Fotos ---------- */
function shrink(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const max = 1280, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      const data = c.toDataURL('image/jpeg', 0.8);
      resolve({ url: data, b64: data.split(',')[1] });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Bild konnte nicht gelesen werden.')); };
    img.src = url;
  });
}

async function addFiles(files) {
  const room = MAX_PHOTOS - S.photos.length;
  for (const f of [...files].slice(0, room)) {
    try { S.photos.push(await shrink(f)); } catch (e) { S.error = e.message; }
  }
  S.error = S.error && S.photos.length ? S.error : '';
  render();
}
['cam', 'lib'].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('change', () => { if (el.files.length) addFiles(el.files); el.value = ''; });
});

/* ---------- Anfrage ---------- */
async function run(fromList) {
  if (!S.key) { openSheet(); return; }
  S.loading = true; S.error = ''; render();
  try {
    const res = await suggest({ images: fromList ? [] : S.photos.map(p => p.b64), ingredients: fromList ? S.detected : [] });
    if (!fromList) S.detected = res.detected;
    S.recipes = res.recipes; S.edited = false;
    S.tab = res.recipes.some(r => r.method === 'airfryer') ? 'af' : 'herd';
    S.last = { detected: S.detected, recipes: S.recipes }; store.set('last', S.last);
    S.loading = false; go('results');
  } catch (e) {
    S.loading = false; S.error = friendly(e); render();
  }
}

/* ---------- Timer ---------- */
const T = { endAt: null, left: null, total: null, id: null, lock: null, audio: null };
const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(Math.max(0, s) % 60).padStart(2, '0');

function resetTimer() {
  clearInterval(T.id); T.endAt = null; T.left = null; T.total = null; releaseLock();
}
function syncTimer() {
  const r = S.current; if (!r || r.method !== 'airfryer' || !r.afMin) return;
  if (T.total !== r.afMin * 60) { resetTimer(); T.total = r.afMin * 60; T.left = T.total; }
  paintTimer();
}
function paintTimer() {
  const tt = document.getElementById('tt'), gob = document.getElementById('tgo'), rs = document.getElementById('trs');
  if (!tt) return;
  tt.textContent = fmt(T.left);
  const running = !!T.endAt, done = T.left === 0;
  gob.textContent = running ? 'Pausieren' : done ? 'Fertig, neu starten' : T.left < T.total ? 'Fortsetzen' : 'Timer starten';
  rs.hidden = running || T.left === T.total;
}
function tick() {
  T.left = Math.max(0, Math.ceil((T.endAt - Date.now()) / 1000));
  if (T.left === 0) { clearInterval(T.id); T.endAt = null; releaseLock(); alarm(); }
  paintTimer();
}
async function startTimer() {
  if (T.left === 0) T.left = T.total;
  T.endAt = Date.now() + T.left * 1000;
  clearInterval(T.id); T.id = setInterval(tick, 250);
  try { T.audio = T.audio || new (window.AudioContext || window.webkitAudioContext)(); T.audio.resume(); } catch {}
  try { if ('wakeLock' in navigator) T.lock = await navigator.wakeLock.request('screen'); } catch {}
  paintTimer();
}
function pauseTimer() { tick(); clearInterval(T.id); T.endAt = null; releaseLock(); paintTimer(); }
function releaseLock() { try { T.lock && T.lock.release(); } catch {} T.lock = null; }
function alarm() {
  try { navigator.vibrate && navigator.vibrate([400, 200, 400, 200, 400]); } catch {}
  const a = T.audio; if (!a) return;
  [0, 0.5, 1].forEach(off => {
    const o = a.createOscillator(), g = a.createGain();
    o.frequency.value = 880; o.connect(g); g.connect(a.destination);
    const t = a.currentTime + off;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.4, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
    o.start(t); o.stop(t + 0.4);
  });
}
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && T.endAt) {
    tick();
    try { if ('wakeLock' in navigator && T.endAt) T.lock = await navigator.wakeLock.request('screen'); } catch {}
  }
});

/* ---------- Einstellungen ---------- */
const sheet = document.getElementById('sheet'), scrim = document.getElementById('scrim');
function openSheet() {
  document.getElementById('f-key').value = S.key;
  document.getElementById('f-model').value = S.model || DEFAULT_MODEL;
  scrim.style.display = 'block';
  requestAnimationFrame(() => sheet.classList.add('open'));
}
function closeSheet() { sheet.classList.remove('open'); scrim.style.display = 'none'; }
scrim.addEventListener('click', () => { if (S.key) closeSheet(); });
document.getElementById('sheet-close').addEventListener('click', closeSheet);
document.getElementById('f-save').addEventListener('click', () => {
  S.key = document.getElementById('f-key').value.trim();
  S.model = document.getElementById('f-model').value.trim() || DEFAULT_MODEL;
  store.set('key', S.key); store.set('model', S.model);
  closeSheet(); render();
});

/* ---------- Ereignisse ---------- */
app.addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a;
  if (a === 'settings') openSheet();
  else if (a === 'cam') document.getElementById('cam').click();
  else if (a === 'lib') document.getElementById('lib').click();
  else if (a === 'rm') { S.photos.splice(+b.dataset.i, 1); render(); }
  else if (a === 'run') run(false);
  else if (a === 'regen') run(true);
  else if (a === 'home') { S.photos = []; resetTimer(); go('home'); }
  else if (a === 'last') { S.detected = S.last.detected || []; S.recipes = S.last.recipes || []; S.edited = false; S.tab = S.recipes.some(r => r.method === 'airfryer') ? 'af' : 'herd'; go('results'); }
  else if (a === 'rmi') { S.detected.splice(+b.dataset.i, 1); S.edited = true; render(); }
  else if (a === 'tab') { S.tab = b.dataset.t; render(); }
  else if (a === 'open') { const r = S.recipes.find(x => x.id === b.dataset.id); if (S.current?.id !== r.id) resetTimer(); S.current = r; go('recipe'); }
  else if (a === 'results') go('results');
  else if (a === 'tgo') T.endAt ? pauseTimer() : startTimer();
  else if (a === 'trs') { T.left = T.total; paintTimer(); }
});
app.addEventListener('change', e => {
  if (e.target.id === 'hp') { S.highProtein = e.target.checked; store.set('hp', S.highProtein); }
});
app.addEventListener('submit', e => {
  if (e.target.id !== 'addf') return;
  e.preventDefault();
  const inp = document.getElementById('addi'), v = inp.value.trim();
  if (v && !S.detected.some(d => d.toLowerCase() === v.toLowerCase())) { S.detected.push(v); S.edited = true; }
  render();
  const n = document.getElementById('addi'); if (n) n.focus();
});

render();
if (!S.key) openSheet();
})();
</script>
